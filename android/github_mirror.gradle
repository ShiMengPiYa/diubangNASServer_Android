// GitHub release/asset 下载镜像与本机代理配置。
// 在 gradle.properties 中设置：
//   localProxyEnabled=true|false
//   localProxyHost=127.0.0.1
//   localProxyPort=7890
//   githubMirrorPrefix=https://ghproxy.net/   （代理开启时忽略）
ext {
    localProxyEnabled = (findProperty('localProxyEnabled') ?: 'false').toString().equalsIgnoreCase('true')
    localProxyHost = (findProperty('localProxyHost') ?: '127.0.0.1').toString().trim()
    localProxyPort = (findProperty('localProxyPort') ?: '7890').toString().trim()
    githubMirrorPrefix = (findProperty('githubMirrorPrefix') ?: '').toString().trim()

    isLocalProxyEnabled = { -> localProxyEnabled }

    mirrorGithubUrl = { String url ->
        if (url == null || url.isEmpty()) {
            return url
        }
        if (localProxyEnabled) {
            return null
        }
        if (githubMirrorPrefix.isEmpty()) {
            return null
        }
        if (url.startsWith('https://github.com/') || url.startsWith('http://github.com/')) {
            def normalized = url.replace('http://github.com/', 'https://github.com/')
            def prefix = githubMirrorPrefix.endsWith('/')
                ? githubMirrorPrefix
                : "${githubMirrorPrefix}/"
            return "${prefix}${normalized}"
        }
        return url
    }
}

gradle.beforeProject { project ->
    if (localProxyEnabled) {
        return
    }
    if (githubMirrorPrefix.isEmpty()) {
        return
    }

    def buildFile = project.buildFile
    if (buildFile == null || !buildFile.exists()) {
        return
    }

    def text = buildFile.getText('UTF-8')
    if (!text.contains('https://github.com/')) {
        return
    }
    if (text.contains('mirrorGithubUrl') ||
        text.contains('ghfast.top') ||
        text.contains('ghproxy')) {
        return
    }

    def prefix = githubMirrorPrefix.endsWith('/')
        ? githubMirrorPrefix
        : "${githubMirrorPrefix}/"
    def patched = text.replace('https://github.com/', "${prefix}https://github.com/")
    if (patched != text) {
        buildFile.setText(patched, 'UTF-8')
        println "[github_mirror] Patched GitHub URLs in ${buildFile}"
    }
}
