name: diubang_nasserver
description: "铥棒文件S - Android NAS 服务端"
license: MIT
repository: https://github.com/DianDanHuaJuan/diubangNASServer_Android
homepage: https://github.com/DianDanHuaJuan/diubangNASServer_Android
issue_tracker: https://github.com/DianDanHuaJuan/diubangNASServer_Android/issues
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_bloc: ^8.1.3
  network_info_plus: ^6.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_foreground_task: ^9.2.2
  cryptography: ^2.0.0
  qr_flutter: ^4.0.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  sqflite: ^2.4.2
  sqflite_common_ffi: 2.3.7
  sqlite3: 2.9.4
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0
  file_picker: ^8.0.0
  extended_image: ^10.0.1
  image: ^4.5.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.0.5

dependency_overrides:
  sqlite3: 2.9.4
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3D8959"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
