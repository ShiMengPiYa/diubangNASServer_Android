import java.io.File
import java.net.InetSocketAddress
import java.net.Proxy
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

apply from: rootProject.file('github_mirror.gradle')

buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

apply plugin: 'com.android.library'

String md5Hex(File file) {
    return MessageDigest.getInstance("MD5").digest(Files.readAllBytes(file.toPath())).encodeHex().toString()
}

boolean jarLooksValid(File file, String expectedMd5) {
    return file.exists() && file.length() >= 1024 && md5Hex(file) == expectedMd5
}

List<String> candidateUrls(String baseUrl) {
    def urls = [] as LinkedHashSet
    // 本机代理开启时直连 GitHub（经 JVM 代理）；否则：镜像前缀（若有）→ 直连
    if (!isLocalProxyEnabled()) {
        def mirror = mirrorGithubUrl(baseUrl)
        if (mirror) {
            urls.add(mirror)
        }
    }
    urls.add(baseUrl)
    return urls as List
}

void applyLocalProxySystemProperties() {
    if (!isLocalProxyEnabled()) {
        return
    }
    System.setProperty("http.proxyHost", localProxyHost)
    System.setProperty("http.proxyPort", localProxyPort)
    System.setProperty("https.proxyHost", localProxyHost)
    System.setProperty("https.proxyPort", localProxyPort)
}

Proxy localHttpProxyOrNull() {
    if (!isLocalProxyEnabled()) {
        return null
    }
    return new Proxy(Proxy.Type.HTTP, new InetSocketAddress(localProxyHost, localProxyPort as int))
}

void downloadJar(String baseUrl, String expectedMd5, File destFile) {
    if (jarLooksValid(destFile, expectedMd5)) {
        return
    }

    if (destFile.exists()) {
        destFile.delete()
        println "MD5 mismatch. File deleted: ${destFile}"
    }

    destFile.parentFile.mkdirs()
    def lastError = null
    System.setProperty("https.protocols", "TLSv1.2,TLSv1.3")
    System.setProperty("jdk.tls.client.protocols", "TLSv1.2,TLSv1.3")
    applyLocalProxySystemProperties()
    def proxy = localHttpProxyOrNull()
    if (proxy != null) {
        println "[localProxy] downloading via ${localProxyHost}:${localProxyPort}"
    }

    // 必须用 for，不能用 .each：Groovy 闭包里的 return 不会退出本方法
    for (String urlString : candidateUrls(baseUrl)) {
        for (int attempt = 1; attempt <= 3; attempt++) {
            try {
                println "Downloading file from: ${urlString} (attempt ${attempt}/3)"
                def url = new URL(urlString)
                def connection = proxy != null ? url.openConnection(proxy) : url.openConnection()
                connection.setRequestProperty("User-Agent", "Mozilla/5.0 (compatible; DiuBangNASServer-Android/1.0)")
                connection.setRequestProperty("Accept", "*/*")
                connection.setConnectTimeout(30000)
                connection.setReadTimeout(600000)
                connection.setInstanceFollowRedirects(true)
                connection.getInputStream().withCloseable { input ->
                    destFile.withOutputStream { output ->
                        output << input
                    }
                }

                if (!jarLooksValid(destFile, expectedMd5)) {
                    throw new GradleException("Downloaded file failed verification: ${destFile} (${destFile.length()} bytes)")
                }
                println "Downloaded OK: ${destFile.name} (${destFile.length()} bytes)"
                return
            } catch (Throwable error) {
                lastError = error
                println "Download failed: ${error}"
                if (destFile.exists()) {
                    destFile.delete()
                }
                if (attempt < 3) {
                    Thread.sleep(attempt * 2000L)
                }
            }
        }
    }

    throw new GradleException(
        "Failed to download ${destFile.name}. Last error: ${lastError != null ? lastError.toString() : 'unknown'}. " +
        "Run .\\tool\\bootstrap_media_kit_android.ps1 before building."
    )
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies {
    def outputDir = file("$buildDir/output")
    if (outputDir.exists()) {
        outputDir.deleteDir()
    }
    outputDir.mkdirs()

    def filesToDownload = [
        ["baseUrl": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-arm64-v8a.jar", "md5": "83df25b61193af8fa815e373143ac9af", "destination": file("$buildDir/v1.1.7/default-arm64-v8a.jar")],
        ["baseUrl": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-armeabi-v7a.jar", "md5": "22e21526fefc0a2b8f17adbec9f57590", "destination": file("$buildDir/v1.1.7/default-armeabi-v7a.jar")],
        ["baseUrl": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-x86_64.jar", "md5": "6fa26bf0459b11f1c0b0dbc29e5b940d", "destination": file("$buildDir/v1.1.7/default-x86_64.jar")],
        ["baseUrl": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-x86.jar", "md5": "0d742b756dc9d1fcd84ea271d8b68f32", "destination": file("$buildDir/v1.1.7/default-x86.jar")]
    ]

    filesToDownload.each { fileInfo ->
        downloadJar(fileInfo.baseUrl, fileInfo.md5, fileInfo.destination)
        copy {
            from fileInfo.destination
            into outputDir
        }
    }
}

assemble.dependsOn(downloadDependencies)
